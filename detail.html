<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionary Details</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/style.detail.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

    <header>

        <a href="index.html" class="logo-link">
            <h1>Cationary</h1>
            <img src="img/Cationary.png" alt="Cationary logo" class="logo">
        </a>

    </header>

<!-- gleich Search form eigentlech wie ufder Home page -->

    <main class="container">

        <form id="searchForm" class="search-form inline">
            <label for="wordInput" class="sr-only">Search a new word</label>
            <div class="search-row">
                <input id="wordInput" name="word" type="text" placeholder="Search a new word..." required>
                <button type="submit" class="search-button">
                     <img src="img/paw_print.png" alt="Search">
                </button>
            </div>
        </form>

        <section id="status" class="card"></section>

        <section id="wordCard" class="card hidden">
                <div class="word-top">
                    <img src="img/cat1.png" alt="Silly Cat" class="silly_cat">
                        <div class="bubble">
                            <h2 id="wordTitle"> </h2>
                            <div id="audioContainer"></div>
                            <p id="phoneticText" class="phonetic"></p>
                        </div>
                </div>
        </section>

<!-- i dem Container isch z Wort, Phonetic und Audio Container, d class "card hidden" isch am afang da, wenn e Wort gsuucht wird, wird die class "hidden" entfernt und die Wortdetails werde ahzeigt, nur wes die details oh gitt, wird die section sichtbar. -->

        <section id="meaningsSection" class="card hidden">
            <h3>Definitions</h3>
            <div id="meaningsContainer"></div>
        </section>
        
<!-- hie si die verschidene Definitione und Bispiu. -->

        <section id="relationsSection" class="card hidden">
            <h3>Synonyms & Antonyms</h3>
            <p class="Synonym"><strong>Synonyms:</strong> <span id="synonymsText">-</span></p>
            <p class="Antonym"><strong>Antonyms:</strong> <span id="antonymsText">-</span></p>
        </section>
<!-- hie si no d Synonym und d Antonym -->

    </main>

    <script src="js/script.js" type="module"></script>

</body>

<footer class="container">
        <h5>Should we explain another <br> word to you?</h5>
            <a href="index.html" class="logo-link">
                <svg class="pfeil" viewBox="0 0 220 120" role="img" aria-label="Arrow to home page" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 112 C 66 95, 112 60, 150 30" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"/>
                    <path d="M126 22 L 160 28 L 141 58" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
        <img src="img/cat1.png" alt="Silly Cat" class="silly_cat" id="silly_cat2">

</footer>
</html>
