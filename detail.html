<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionary Details</title>
    <link rel="stylesheet" href="css/style.detail.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

    <header class="container">
        <h1>English Dictionary</h1>
        <form id="searchForm" class="search-form inline">
            <label for="wordInput" class="sr-only">Search a new word</label>
            <div class="search-row">
                <input id="wordInput" name="word" type="text" placeholder="Search a new word..." required>
                <button type="submit">Search</button>
            </div>
        </form>
    </header>

<!-- gleich Search form eigentlech wie ufder Home page -->

    <main class="container">
        <section id="status" class="card"></section>

        <section id="wordCard" class="card hidden">
            <div class="word-top">
                <div>
                    <h2 id="wordTitle"></h2>
                    <p id="phoneticText" class="phonetic"></p>
                </div>
                <div id="audioContainer"></div>
            </div>
        </section>

<!-- i dem Container isch z Wort, Phonetic und Audio Container, d class "card hidden" isch am afang da, wenn e Wort gsuucht wird, wird die class "hidden" entfernt und die Wortdetails werde ahzeigt, nur wes die details oh gitt, wird die section sichtbar. -->

        <section id="meaningsSection" class="card hidden">
            <h3>Definitions</h3>
            <div id="meaningsContainer"></div>
        </section>
        
<!-- hie si die verschidene Definitione und Bispiu. -->

        <section id="relationsSection" class="card hidden">
            <h3>Synonyms & Antonyms</h3>
            <p><strong>Synonyms:</strong> <span id="synonymsText">-</span></p>
            <p><strong>Antonyms:</strong> <span id="antonymsText">-</span></p>
        </section>
<!-- hie si no d Synonym und d Antonym -->

    </main>

    <script src="js/script.js" type="module"></script>

</body>
</html>
